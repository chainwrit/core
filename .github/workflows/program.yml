name: program

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: solanafoundation/anchor:v0.32.1
    steps:
      - uses: actions/checkout@v4

      - name: Policy engine unit tests
        run: cargo test -p chainwrit

      - name: Build program and IDL
        run: anchor build

      - uses: actions/upload-artifact@v4
        with:
          name: program
          path: |
            target/deploy/chainwrit.so
            target/idl/chainwrit.json
            target/types/chainwrit.ts
